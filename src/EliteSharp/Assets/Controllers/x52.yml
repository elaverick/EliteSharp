# The Saitek (later Logitech) X52 HOTAS: a stick and throttle that are one USB
# device. The button numbers follow FlightGear's X52 configuration; the
# buttons whose names aren't known are shown by number. The axes after the
# stick and throttle are in the order Linux reports them, which SDL may not
# keep on every system, so check them on the Controls screen.
#
# By default the throttle sets the speed, and the stick rolls (left and
# right) and pitches (forward and back). The twist, rotaries and slider do
# nothing until they're bound.
#
# The picture is 1984 x 576 pixels, and each control's position is in its
# pixels (tools/draw-controllers.py draws it, and writes the positions here).
name: Saitek X52
kind: hotas
devices: [06A3:075C, 06A3:0255]
image: x52.png
buttons:
  - Trigger @ 656,172
  - Fire @ 640,30
  - A @ 578,39
  - B @ 660,50
  - C @ 689,134
  - Pinkie @ 669,281
  - D @ 1416,28
  - E @ 1379,52
  - T1 @ 380,444
  - T2 @ 396,472
  - T3 @ 462,463
  - T4 @ 478,492
  - T5 @ 547,484
  - T6 @ 562,512
  - Trigger 2 @ 655,201
  - Hat 2 Up @ 611,47
  - Hat 2 Right @ 625,61
  - Hat 2 Down @ 611,75
  - Hat 2 Left @ 597,61
  - Hat 3 Up @ 1476,141
  - Hat 3 Right @ 1488,153
  - Hat 3 Down @ 1476,165
  - Hat 3 Left @ 1464,153
  - Mode 1 @ 499,93
  - Mode 2 @ 512,101
  - Mode 3 @ 523,84
  - Function @ 1428,387
