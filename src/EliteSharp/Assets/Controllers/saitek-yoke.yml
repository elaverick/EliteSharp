# The Saitek (later Logitech) Pro Flight Yoke, with the throttle quadrant
# that plugs into it (which makes them one USB device). The button numbers
# follow FlightGear's Pro Flight Yoke configuration; the buttons whose names
# aren't known (such as the mode switch's) are shown by number.
#
# By default the yoke rolls (turning it) and pitches (pushing and pulling
# it), and the left-hand lever on the quadrant sets the speed. The other two
# levers do nothing until they're bound.
#
# The picture is 1984 x 576 pixels, and each control's position is in its
# pixels (tools/draw-controllers.py draws it, and writes the positions here).
name: Saitek Pro Flight Yoke
kind: yoke
devices: [06A3:0BAC]
image: yoke.png
buttons:
  - Left Button @ 169,210
  - D @ 988,203
  - A1 @ 451,251
  - A2 @ 451,293
  - B1 @ 571,259
  - B2 @ 571,301
  - C1 @ 693,267
  - C2 @ 693,310
  - "-"
  - "-"
  - "-"
  - "-"
  - "-"
  - "-"
  - T1 @ 1476,405
  - T2 @ 1473,465
  - T3 @ 1620,416
  - T4 @ 1616,476
  - T5 @ 1766,426
  - T6 @ 1761,486
axes:
  - Yoke Turn @ 575,258
  - Yoke Push @ 575,324
  - Lever 1 @ 1497,103
  - Lever 2 @ 1641,112
  - Lever 3 @ 1787,120
hats:
  - Hat @ 198,28
dead_zone: 0.05
defaults:
  axes:
    roll: axis 0
    pitch: axis 1
    throttle: axis 2 reversed
  flight:
    fire_laser: button 0
    launch_missile: button 1
    target_missile: button 2
    unarm_missile: button 3
    ecm: button 4
    energy_bomb: button 5
    in_system_jump: button 6
    docking_computer: button 7
    front_view: hat 0 up
    rear_view: hat 0 down
    left_view: hat 0 left
    right_view: hat 0 right
    short_range_chart: button 14
    galactic_chart: button 15
    hyperspace: button 16
    pause: button 17
    status: button 18
    market_prices: button 19
  screens:
    select: button 0
    yes: button 2
    no: button 1
    delete: button 3
    cursor_up: hat 0 up
    cursor_down: hat 0 down
    cursor_left: hat 0 left
    cursor_right: hat 0 right
    fast_cursor: button 4
    equip_ship: button 5
    in_system_jump: button 6
    docking_computer: button 7
    short_range_chart: button 14
    galactic_chart: button 15
    hyperspace: button 16
    launch: button 17
    status: button 18
    market_prices: button 19
  paused:
    resume: [button 17, button 0]
    quit: button 7
    volume_down: hat 0 left
    volume_up: hat 0 right
    sound_on: hat 0 up
    sound_off: hat 0 down
    reverse_pitch: button 2
    controller_only: button 3
    settings: button 4
  typing:
    accept: button 0
    cancel: button 1
    delete: button 3
