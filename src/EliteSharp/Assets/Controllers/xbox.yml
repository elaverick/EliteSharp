# The gamepad profile, used by every gamepad that SDL recognises (SDL presents
# them all with the Xbox controller's layout). The buttons and axes are in the
# order of SDL's game controller layout; the controls that a gamepad doesn't
# have (such as the paddles, on most) aren't shown.
#
# The picture is 1984 x 576 pixels, and each control's position is in its
# pixels (tools/draw-controllers.py draws it, and writes the positions here).
name: Xbox Controller
kind: gamepad
image: xbox.png
buttons:
  - A @ 1250,221
  - B @ 1313,171
  - X @ 1180,171
  - Y @ 1243,122
  - Back @ 926,166
  - Xbox @ 992,122
  - Start @ 1058,166
  - L3 @ 746,141
  - R3 @ 1130,243
  - LB @ 739,116
  - RB @ 1245,116
  - D-pad Up @ 857,234
  - D-pad Down @ 855,312
  - D-pad Left @ 805,272
  - D-pad Right @ 907,272
  - Share @ 992,208
  - Paddle 1
  - Paddle 2
  - Paddle 3
  - Paddle 4
  - Touchpad
axes:
  - Left X @ 746,141
  - Left Y @ 746,141
  - Right X @ 1130,243
  - Right Y @ 1130,243
  - LT @ 731,47
  - RT @ 1253,47
defaults:
  axes:
    roll: axis 0
    pitch: axis 1
    speed_up: axis 5
    slow_down: axis 4
    chart_x: axis 2
    chart_y: axis 3
  flight:
    fire_laser: button 0
    launch_missile: button 1
    target_missile: button 2
    unarm_missile: button 3
    ecm: button 10
    front_view: button 11
    rear_view: button 12
    left_view: button 13
    right_view: button 14
    in_system_jump: button 7
    docking_computer: button 8
    short_range_chart: button 4
    pause: button 6
  screens:
    select: button 0
    yes: button 3
    no: button 1
    delete: button 2
    cursor_up: button 11
    cursor_down: button 12
    cursor_left: button 13
    cursor_right: button 14
    fast_cursor: button 10
    launch: button 6
    in_system_jump: button 7
    docking_computer: button 8
    short_range_chart: button 4
  second_functions:
    second_functions: button 9
    energy_bomb: button 10
    escape_pod: button 4
    hyperspace: button 0
    galactic_hyperspace: button 1
    short_range_chart: button 13
    galactic_chart: button 14
    data_on_system: button 2
    market_prices: button 12
    status: button 11
    inventory: button 3
    equip_ship: button 6
  paused:
    resume: [button 6, button 1]
    quit: button 4
    volume_down: button 13
    volume_up: button 14
    sound_on: button 11
    sound_off: button 12
    reverse_pitch: button 3
    controller_only: button 2
    settings: button 10
  typing:
    accept: button 0
    cancel: button 1
    delete: button 2
