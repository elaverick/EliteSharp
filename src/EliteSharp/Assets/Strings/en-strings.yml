# The game's fixed text in English: the screen titles and labels, the
# commodity, equipment and rating names, the in-flight messages, and so on.
#
# The game asks for each string by its key (such as "equipment.fuel"), so a
# translation is another file with the same keys, named after its language
# (such as fr-strings.yml), and chosen with --language.
#
# The text is written as it appears on the screen, and printed as it is
# written, apart from where the screen is in capitals (such as the screen
# titles and the in-flight messages), where it is printed in capitals. Some
# strings are only ever shown in capitals, so they are written that way.
#
# The spelling, spacing and capitals are the original's, including its
# quirks (such as "E.C.M.System", "Tech.Level" and the two spaces in
# "Military  Laser"), so the game looks as it did.
#
#   - Each character must be in the font (Assets/Images/font.png), which has
#     the printable ASCII characters (so no accents, yet).
#   - \n is a newline, and \a is a beep.
#   - These placeholders print a value:
#
#       {cash}               our cash, then " Cr" and a newline
#       {galaxy}             the galaxy number
#       {current_system}     the name of the system we are in
#       {system}             the name of the selected system
#       {commander}          the commander's name
#       {default_commander}  the default commander's name (JAMESON)
#
# Where the text goes on the screen is up to the game, so a translation only
# needs to translate the words.

# The text that the game generates (the "goat soup" system descriptions and
# the species names) is not here, but in en-descriptions.yml, and the
# missions' text is in Assets/Missions.

