    left_view: hat 0 left
    right_view: hat 0 right
    in_system_jump: button 6
    docking_computer: button 7
    hyperspace: button 8
    short_range_chart: button 15
    galactic_chart: button 16
    data_on_system: button 17
    status: button 18
    market_prices: button 19
    inventory: button 21
    pause: button 29
    settings: button 26
  screens:
