# Build a native Apple Silicon package for the macOS tester.
# The Vulkan SDK supplies MoltenVK and the Vulkan loader. The package keeps
# the game's external Assets folder beside the executable, as EliteSharp expects.
name: macOS build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: macos-build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-macos-arm64:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Install Vulkan SDK
        shell: bash
        env:
          VULKAN_SDK_VERSION: 1.4.363.0
        run: |
          set -euo pipefail
          archive="vulkansdk-macos-${VULKAN_SDK_VERSION}.zip"
          url="https://sdk.lunarg.com/sdk/download/${VULKAN_SDK_VERSION}/mac/${archive}"
          curl --fail --location --retry 3 "${url}" --output "${RUNNER_TEMP}/${archive}"
          unzip -q "${RUNNER_TEMP}/${archive}" -d "${RUNNER_TEMP}/vulkan-sdk"

          # LunarG's macOS archive uses a versioned .app bundle. Discover the
          # installer rather than assuming a fixed bundle name or extraction layout.
          installer="$(find "${RUNNER_TEMP}/vulkan-sdk" -type f -path '*/Contents/MacOS/*' -perm -111 -print | grep -E '/vulkansdk.*.app/Contents/MacOS/' | head -n 1 || true)"
          if [[ -z "${installer}" ]]; then
            echo "::error::Could not locate the executable inside the versioned Vulkan SDK installer app"
            find "${RUNNER_TEMP}/vulkan-sdk" -maxdepth 6 -print
            exit 1
          fi

          sdk_dir="${HOME}/VulkanSDK/${VULKAN_SDK_VERSION}"
          "${installer}" --root "${sdk_dir}" --accept-licenses --default-answer --confirm-command install

          if [[ ! -f "${sdk_dir}/setup-env.sh" ]]; then
            echo "::error::Vulkan SDK setup-env.sh not found at ${sdk_dir}"
            find "${HOME}/VulkanSDK" -maxdepth 5 -name setup-env.sh -print
            exit 1
          fi
          echo "VULKAN_SDK=${sdk_dir}" >> "$GITHUB_ENV"
          echo "${sdk_dir}/macOS/bin" >> "$GITHUB_PATH"
          source "${sdk_dir}/setup-env.sh"
          echo "Installed Vulkan SDK ${VULKAN_SDK_VERSION}"

      - name: Test
        run: dotnet test src/EliteSharp.sln -c Release

      - name: Publish self-contained app
        shell: bash
        run: |
          dotnet publish src/EliteSharp/EliteSharp.csproj \
            -c Release \
            -r osx-arm64 \
            --self-contained true \
            -p:PublishSingleFile=true \
            -p:IncludeNativeLibrariesForSelfExtract=true \
            -o publish/EliteSharp

      - name: Bundle Vulkan runtime libraries
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p publish/EliteSharp/lib
          # Stage loader and MoltenVK shared libraries alongside the apphost.
          # Exact SDK paths can vary by SDK version, so discover them.
          find "${VULKAN_SDK}/macOS" -type f \( -name 'libvulkan*.dylib' -o -name 'libMoltenVK*.dylib' \) -print -exec cp -L '{}' publish/EliteSharp/lib/ \;
          if [[ -z "$(find publish/EliteSharp/lib -type f -name '*MoltenVK*.dylib' -print -quit)" ]]; then
            echo "::warning::MoltenVK library was not found in the expected SDK tree; tester may need to install Vulkan SDK."
          fi
          echo "Vulkan SDK libraries staged:"
          ls -la publish/EliteSharp/lib
          echo "Apphost:"
          ls -la publish/EliteSharp/EliteSharp

      - name: Package
        shell: bash
        run: |
          set -euo pipefail
          cat > publish/EliteSharp/README-macOS.txt <<'EOF'
          EliteSharp — macOS Apple Silicon test build

          This is an unsigned test build for Apple Silicon Macs. macOS may
          warn when opening software that is not signed and notarised.

          Run from Terminal in this folder:
            ./EliteSharp

          Keep the Assets folder and lib folder beside the executable.
          If the game reports a Vulkan loader or MoltenVK error, share the
          terminal output with the EliteSharp maintainers.
          EOF
          ditto -c -k --sequesterRsrc --keepParent publish/EliteSharp \
            EliteSharp-macos-arm64.zip

      - uses: actions/upload-artifact@v4
        with:
          name: EliteSharp-macos-arm64
          path: EliteSharp-macos-arm64.zip
          if-no-files-found: error
          retention-days: 14
