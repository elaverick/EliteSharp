# The game's fixed text in English: the screen titles and labels, the
# commodity, equipment and rating names, the in-flight messages, and so on.
#
# The game asks for each string by its key (such as "equipment.fuel"), so a
# translation is another file with the same keys, named after its language
# (such as fr-strings.yml), and chosen with --language.
#
# The text is printed as the original prints it:
#
#   - Letters are written in capitals, as the game applies the case (such as
#     Sentence Case) as it prints them, and the font only has ASCII characters.
#   - \n is a newline.
#   - The words in braces print something, or change how the text is printed:
#
#       {cash}            our cash, then " CR" and a newline
#       {galaxy}          the galaxy number
#       {current_system}  the name of the system we are in
#       {system}          the name of the selected system
#       {commander}       the commander's name
#       {fuel_and_cash}   our fuel and cash, as on the Status screen
#       {sentence_case}   switch to Sentence Case
#       {all_caps}        switch to capitals
#       {lower_case}      switch to lower case
#       {capitalise}      print the next letter in capitals
#       {tab_colon}       move to column 21 and print a colon
#       {tab}             move to column 6
#       {line_feed}       move down a line without returning to the left
#       {bell}            beep
#       {left_align}      stop justifying text
#       {clear_screen}    clear the screen
#       {clear_bottom}    clear the bottom three rows of the screen
#       {title_line}      draw the line under the screen title
#       {drive}           the drive number, in the disc catalogue
#       {input}           read a line from the keyboard
#
# The text that the game generates (the "goat soup" system descriptions and
# the species names) is not here, but in en-descriptions.yml, and the
# missions' text is in Assets/Missions.

