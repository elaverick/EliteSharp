# The Saitek (later Logitech) X52 Pro HOTAS: a stick and throttle that are one
# USB device. The button numbers follow FlightGear's X52 Pro configuration;
# the buttons whose names aren't known (such as the mouse and scroll wheel,
# and the buttons beside the display) are shown by number. The axes after the
# stick and throttle may be in a different order on some systems, so check
# them on the Controls screen.
#
# By default the throttle sets the speed, and the stick rolls (left and
# right) and pitches (forward and back). The twist, rotaries and slider do
# nothing until they're bound.
#
# It shares the X52's picture, which is 1984 x 576 pixels, and each
# control's position is in its pixels (tools/draw-controllers.py draws it,
# and writes the positions here).
